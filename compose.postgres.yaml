services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: pantrykind
      POSTGRES_DB: pantrykind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pantrykind -d pantrykind']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  pantrykind:
    build:
      context: .
      args:
        WITH_POSTGRES: 'true'
    ports: ['127.0.0.1:8000:8000']
    env_file: .env
    environment:
      DEBUG: 'false'
      DATABASE_PATH: ''
      DATABASE_URL: ${DATABASE_URL:?Set the matching PostgreSQL connection URL in .env}
      BIND_HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
volumes:
  postgres-data:
